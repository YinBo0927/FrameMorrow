[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "framemorrow-selector"
version = "0.1.0"
description = "Independent paper-based reproduction of the FrameMorrow frame selector"
requires-python = ">=3.10"
dependencies = [
    "torch==2.8.0",
    "torchvision==0.23.0",
    "transformers==4.57.6",
    "huggingface_hub==0.36.0",
    "numpy==2.0.2",
    "Pillow==11.3.0",
    "sentencepiece==0.2.1",
    "safetensors==0.6.2",
    "requests==2.32.5",
    "scipy>=1.11,<2",
]

[tool.setuptools.packages.find]
include = ["framemorrow*"]
